services:
  - type: web
    name: society-backend
    env: docker
    plan: free
    dockerContext: server
    dockerfilePath: server/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: society-db
          property: connectionString
      - key: PORT
        value: 6000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: '*'
      - key: CLOUDINARY_CLOUD_NAME
        value: dummy
      - key: CLOUDINARY_API_KEY
        value: dummy
      - key: CLOUDINARY_API_SECRET
        value: dummy
      - key: RESEND_API_KEY
        value: dummy
      - key: FROM_EMAIL
        value: noreply@dummy.com
      - key: GROQ_API_KEY
        value: dummy

  - type: web
    name: society-frontend
    env: static
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: society-backend
          property: url

databases:
  - name: society-db
    plan: free
    databaseName: society_db
    user: society_user
